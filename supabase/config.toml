# Supabase CLI — https://supabase.com/docs/guides/cli
project_id = "nova-health"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://nova-health-eight.vercel.app"
additional_redirect_urls = ["https://nova-health-eight.vercel.app/**", "http://localhost:8081/**"]

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = true

[functions.nova-chat]
verify_jwt = true

[functions.analyze-meal]
verify_jwt = true
